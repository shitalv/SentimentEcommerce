<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentiment E-commerce Platform</title>
    <link href="https://cdn.replit.com/agent/bootstrap-agent-dark-theme.min.css" rel="stylesheet">
    <style>
        body {
            padding: 20px; 
            background-color: #212529; 
            color: #f8f9fa;
        }
        .card {
            background-color: #2c3034; 
            color: #f8f9fa; 
            border-color: #495057;
            margin-bottom: 15px;
        }
        .sentiment-positive { color: #28a745; }
        .sentiment-neutral { color: #6c757d; }
        .sentiment-negative { color: #dc3545; }
    </style>
</head>
<body>
    <div class="container" id="app">
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
            <div class="container-fluid">
                <a class="navbar-brand" href="/">Sentiment E-commerce</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav me-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/reports/sentiment">Sentiment Reports</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin/reports/hype-reality">Hype vs. Reality</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/admin">Admin Dashboard</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="row mb-4">
            <div class="col">
                <h1>Product Listings with Sentiment Analysis</h1>
                <p class="lead">Browse products with AI-powered sentiment analysis from customer reviews</p>
            </div>
        </div>

        <div id="error-message" class="alert alert-danger d-none" role="alert"></div>

        <div id="loading" class="text-center my-5">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Loading...</span>
            </div>
        </div>

        <div id="product-list" class="row d-none"></div>
        <div id="product-detail" class="d-none"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Store state
        let selectedProduct = null;
        
        // Elements
        const errorEl = document.getElementById('error-message');
        const loadingEl = document.getElementById('loading');
        const productListEl = document.getElementById('product-list');
        const productDetailEl = document.getElementById('product-detail');
        
        // Show error
        function showError(message) {
            errorEl.textContent = message;
            errorEl.classList.remove('d-none');
        }
        
        // Format sentiment
        function formatSentimentPercentage(value) {
            return Math.round(value * 100) + '%';
        }
        
        // Create sentiment bar
        function createSentimentBar(type, value) {
            const colorClass = type === 'positive' ? 'bg-success' : type === 'negative' ? 'bg-danger' : 'bg-secondary';
            const textClass = type === 'positive' ? 'sentiment-positive' : type === 'negative' ? 'sentiment-negative' : 'sentiment-neutral';
            
            return `
                <div class="d-flex justify-content-between mb-1">
                    <span>${type.charAt(0).toUpperCase() + type.slice(1)}:</span>
                    <span class="${textClass}">${formatSentimentPercentage(value)}</span>
                </div>
                <div class="progress mb-2">
                    <div class="progress-bar ${colorClass}" style="width: ${value * 100}%"></div>
                </div>
            `;
        }
        
        // Create product card
        function createProductCard(product) {
            const card = document.createElement('div');
            card.className = 'col-md-4 mb-4';
            
            let sentimentHtml = '';
            if (product.sentiment) {
                sentimentHtml = `
                    <div class="mb-3">
                        ${createSentimentBar('positive', product.sentiment.positive)}
                        ${createSentimentBar('neutral', product.sentiment.neutral)}
                        ${createSentimentBar('negative', product.sentiment.negative)}
                    </div>
                `;
            }
            
            card.innerHTML = `
                <div class="card h-100">
                    ${product.image_url ? `
                        <img src="${product.image_url}" class="card-img-top p-3" 
                             alt="${product.name}" style="height: 200px; object-fit: contain;">
                    ` : ''}
                    <div class="card-body">
                        <h5 class="card-title">${product.name}</h5>
                        <p class="card-text">
                            <strong>Category:</strong> ${product.category || 'Uncategorized'}<br>
                            <strong>Price:</strong> $${(product.price || 0).toFixed(2)}<br>
                            <strong>Reviews:</strong> ${product.review_count || 0}
                        </p>
                        ${sentimentHtml}
                        <button class="btn btn-primary view-product" data-id="${product.id}">
                            View Details
                        </button>
                    </div>
                </div>
            `;
            
            card.querySelector('.view-product').addEventListener('click', () => {
                fetchProductDetails(product.id);
            });
            
            return card;
        }
        
        // Render product list
        function renderProductList(products) {
            productListEl.innerHTML = '';
            
            if (!products || products.length === 0) {
                productListEl.innerHTML = '<div class="alert alert-info col-12">No products found</div>';
                return;
            }
            
            products.forEach(product => {
                productListEl.appendChild(createProductCard(product));
            });
            
            loadingEl.classList.add('d-none');
            productListEl.classList.remove('d-none');
        }
        
        // Render product detail
        function renderProductDetail(product) {
            let reviewsHtml = '';
            
            if (product.reviews && product.reviews.length > 0) {
                const reviewsList = product.reviews.map(review => {
                    const stars = Array(5).fill('').map((_, i) => 
                        `<span class="${i < review.rating ? 'text-warning' : 'text-muted'}">★</span>`
                    ).join('');
                    
                    let sentimentBadge = '';
                    if (review.sentiment_class) {
                        const badgeClass = review.sentiment_class === 'positive' ? 'bg-success' : 
                                        review.sentiment_class === 'negative' ? 'bg-danger' : 'bg-secondary';
                        sentimentBadge = `<span class="badge ${badgeClass}">${review.sentiment_class}</span>`;
                    }
                    
                    return `
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between">
                                    <h5>${review.author || 'Anonymous'}</h5>
                                    <div>${stars}</div>
                                </div>
                                <p class="card-text">${review.text}</p>
                                ${sentimentBadge}
                            </div>
                        </div>
                    `;
                }).join('');
                
                reviewsHtml = `
                    <div class="mt-4">
                        <h3>Reviews</h3>
                        ${reviewsList}
                    </div>
                `;
            }
            
            let sentimentHtml = '';
            if (product.sentiment) {
                sentimentHtml = `
                    <h5>Sentiment Analysis</h5>
                    <div class="mb-3">
                        ${createSentimentBar('positive', product.sentiment.positive)}
                        ${createSentimentBar('neutral', product.sentiment.neutral)}
                        ${createSentimentBar('negative', product.sentiment.negative)}
                    </div>
                `;
            }
            
            productDetailEl.innerHTML = `
                <div class="card">
                    <div class="card-body">
                        <button id="back-button" class="btn btn-secondary mb-3">
                            &larr; Back to Products
                        </button>
                        
                        <div class="row">
                            <div class="col-md-4">
                                ${product.image_url ? `
                                    <img src="${product.image_url}" class="img-fluid mb-3" 
                                         alt="${product.name}" style="max-height: 300px; object-fit: contain;">
                                ` : ''}
                            </div>
                            <div class="col-md-8">
                                <h2>${product.name}</h2>
                                <p class="lead">$${(product.price || 0).toFixed(2)}</p>
                                <div class="mb-3">
                                    <span class="badge bg-secondary">${product.category || 'Uncategorized'}</span>
                                </div>
                                
                                ${product.description ? `
                                    <div class="mb-3">
                                        <h5>Description</h5>
                                        <p>${product.description}</p>
                                    </div>
                                ` : ''}
                                
                                ${sentimentHtml}
                            </div>
                        </div>
                        
                        ${reviewsHtml}
                    </div>
                </div>
            `;
            
            document.getElementById('back-button').addEventListener('click', () => {
                productDetailEl.classList.add('d-none');
                productListEl.classList.remove('d-none');
            });
            
            loadingEl.classList.add('d-none');
            productListEl.classList.add('d-none');
            productDetailEl.classList.remove('d-none');
        }
        
        // Fetch products from API
        async function fetchProducts() {
            try {
                loadingEl.classList.remove('d-none');
                productListEl.classList.add('d-none');
                
                const response = await fetch('/api/products');
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('API Response:', data);
                
                renderProductList(data.products || []);
            } catch (err) {
                console.error('Error fetching products:', err);
                showError('Failed to load products. Please try again.');
                loadingEl.classList.add('d-none');
            }
        }
        
        // Fetch product details
        async function fetchProductDetails(productId) {
            try {
                loadingEl.classList.remove('d-none');
                productListEl.classList.add('d-none');
                productDetailEl.classList.add('d-none');
                
                const response = await fetch(`/api/products/${productId}`);
                
                if (!response.ok) {
                    throw new Error(`Error ${response.status}: ${response.statusText}`);
                }
                
                const data = await response.json();
                console.log('Product details:', data);
                
                selectedProduct = data;
                renderProductDetail(data);
            } catch (err) {
                console.error('Error fetching product details:', err);
                showError('Failed to load product details. Please try again.');
                loadingEl.classList.add('d-none');
                productListEl.classList.remove('d-none');
            }
        }
        
        // Initialize
        document.addEventListener('DOMContentLoaded', () => {
            fetchProducts();
        });
    </script>
</body>
</html>
